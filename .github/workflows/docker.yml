name: Docker images

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version manifest
        id: manifest
        run: |
          echo "matrix=$(jq -c '{include: .versions}' versions.json)" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate scripts, manifest, Compose, and upstream checksums
        run: |
          bash -n docker/docker-entrypoint.sh tests/*.sh scripts/*.sh
          tests/check-versions.sh
          docker compose --env-file .env.example config --quiet

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Moodle ${{ matrix.moodle }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          pull: true
          tags: moodle:test-${{ matrix.series }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            MOODLE_VERSION=${{ matrix.moodle }}
            MOODLE_BRANCH=${{ matrix.branch }}
            MOODLE_SHA256=${{ matrix.sha256 }}
            MOODLE_DOCUMENT_ROOT=${{ matrix.document_root }}
          cache-from: type=gha,scope=moodle-${{ matrix.series }}
          cache-to: type=gha,mode=max,scope=moodle-${{ matrix.series }}

      - name: Run fresh-install smoke test
        run: tests/smoke.sh moodle:test-${{ matrix.series }} '${{ matrix.moodle }}' '${{ matrix.document_root }}'

  upgrade:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build upgrade-chain images
        run: |
          while IFS= read -r version; do
            series="$(jq -r .series <<<"$version")"
            docker build --pull \
              --build-arg "PHP_VERSION=$(jq -r .php <<<"$version")" \
              --build-arg "MOODLE_VERSION=$(jq -r .moodle <<<"$version")" \
              --build-arg "MOODLE_BRANCH=$(jq -r .branch <<<"$version")" \
              --build-arg "MOODLE_SHA256=$(jq -r .sha256 <<<"$version")" \
              --build-arg "MOODLE_DOCUMENT_ROOT=$(jq -r .document_root <<<"$version")" \
              --tag "moodle:upgrade-${series}" .
          done < <(jq -c '.versions[]' versions.json)

      - name: Test complete legacy upgrade chain
        run: tests/upgrade.sh moodle:upgrade-3.11 moodle:upgrade-4.1 moodle:upgrade-4.5 moodle:upgrade-5.2

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [prepare, validate, test, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check required Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'DOCKERHUB_USERNAME is not configured'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'DOCKERHUB_TOKEN is not configured'; exit 1; }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: image
        env:
          VERSION_TAGS: ${{ toJSON(matrix.tags) }}
        run: |
          {
            echo 'tags<<EOF'
            jq -r '.[]' <<<"$VERSION_TAGS" | while IFS= read -r tag; do
              echo "aesr/moodle:${tag}"
              echo "ghcr.io/42ae/moodle:${tag}"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Moodle ${{ matrix.moodle }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            MOODLE_VERSION=${{ matrix.moodle }}
            MOODLE_BRANCH=${{ matrix.branch }}
            MOODLE_SHA256=${{ matrix.sha256 }}
            MOODLE_DOCUMENT_ROOT=${{ matrix.document_root }}
          cache-from: type=gha,scope=moodle-${{ matrix.series }}
          cache-to: type=gha,mode=max,scope=moodle-${{ matrix.series }}
          provenance: mode=max
          sbom: true
